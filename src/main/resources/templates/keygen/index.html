<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Key Generator', ~{::content})}">
<body>
<th:block th:fragment="content">
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/}">HomeUtils</a></li>
            <li class="breadcrumb-item active">Key Generator</li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="bi bi-key-fill me-2"></i>Key Generator</h4>
                </div>
                <div class="card-body p-4">

                    <!-- Key Type Selection -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Key Type</label>
                        <select id="keyType" class="form-select">
                            <optgroup label="HMAC Secrets">
                                <option value="hmac-sha256">HMAC-SHA256 (256-bit)</option>
                                <option value="hmac-sha384">HMAC-SHA384 (384-bit)</option>
                                <option value="hmac-sha512">HMAC-SHA512 (512-bit)</option>
                            </optgroup>
                            <optgroup label="Random Keys">
                                <option value="random" selected>Random Secret (configurable)</option>
                            </optgroup>
                            <optgroup label="UUID">
                                <option value="uuid">UUID v4</option>
                                <option value="uuid-nodash">UUID v4 (no dashes)</option>
                            </optgroup>
                            <optgroup label="SSH Key Pairs">
                                <option value="ssh-ed25519">OpenSSH Ed25519 (recommended)</option>
                                <option value="ssh-rsa2048">OpenSSH RSA 2048-bit</option>
                                <option value="ssh-rsa4096">OpenSSH RSA 4096-bit</option>
                            </optgroup>
                        </select>
                    </div>

                    <!-- Random key options -->
                    <div id="randomOptions">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Length (bytes)</label>
                                <select id="keyBytes" class="form-select">
                                    <option value="16">16 bytes (128-bit)</option>
                                    <option value="24">24 bytes (192-bit)</option>
                                    <option value="32" selected>32 bytes (256-bit)</option>
                                    <option value="48">48 bytes (384-bit)</option>
                                    <option value="64">64 bytes (512-bit)</option>
                                    <option value="128">128 bytes (1024-bit)</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Encoding</label>
                                <select id="keyEncoding" class="form-select">
                                    <option value="hex">Hex</option>
                                    <option value="base64" selected>Base64</option>
                                    <option value="base64url">Base64 URL-safe</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Count (hidden for SSH) -->
                    <div class="mb-3" id="countSection">
                        <label class="form-label fw-semibold">Count</label>
                        <input id="keyCount" type="number" class="form-control" value="1" min="1" max="50" style="max-width:120px"/>
                    </div>

                    <button id="btnGenerate" class="btn btn-primary w-100">
                        <i class="bi bi-lightning-fill me-1"></i>Generate
                    </button>

                    <div id="errorArea" class="mt-3 alert alert-danger d-none"></div>

                    <!-- Results: regular keys -->
                    <div id="resultArea" class="mt-4 d-none">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h5 class="mb-0">Generated Keys</h5>
                            <button id="btnCopyAll" class="btn btn-sm btn-outline-secondary">
                                <i class="bi bi-clipboard me-1"></i>Copy All
                            </button>
                        </div>
                        <div id="keyList"></div>
                    </div>

                    <!-- Results: SSH key pair -->
                    <div id="sshResultArea" class="mt-4 d-none">
                        <h5 class="mb-3">Generated SSH Key Pair</h5>
                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label class="form-label fw-semibold mb-0">Public Key <span class="text-muted small fw-normal">(paste into authorized_keys)</span></label>
                                <button class="btn btn-sm btn-outline-secondary copySshFieldBtn" data-target="sshPublicKey"><i class="bi bi-clipboard me-1"></i>Copy</button>
                            </div>
                            <textarea id="sshPublicKey" class="form-control font-monospace" rows="3" readonly></textarea>
                        </div>
                        <div class="mb-1">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label class="form-label fw-semibold mb-0">Private Key <span class="text-muted small fw-normal">(save as ~/.ssh/id_ed25519 or id_rsa, chmod 600)</span></label>
                                <button class="btn btn-sm btn-outline-secondary copySshFieldBtn" data-target="sshPrivateKey"><i class="bi bi-clipboard me-1"></i>Copy</button>
                            </div>
                            <textarea id="sshPrivateKey" class="form-control font-monospace" rows="10" readonly></textarea>
                        </div>
                        <div class="alert alert-warning mt-3 mb-0 py-2 small">
                            <i class="bi bi-exclamation-triangle me-1"></i>
                            Keys are generated in your browser session and never stored on the server. Save your private key securely.
                        </div>
                    </div>
                </div>
            </div>

            <!-- Quick generators -->
            <div class="row mt-4">
                <div class="col-md-4 mb-3">
                    <div class="card shadow-sm h-100">
                        <div class="card-body text-center">
                            <i class="bi bi-shield-lock fs-2 text-success"></i>
                            <h6 class="mt-2">JWT Secret</h6>
                            <p class="text-muted small mb-2">256-bit HMAC-SHA256 key</p>
                            <button class="btn btn-sm btn-outline-success quickGenBtn" data-preset="hmac-sha256">Generate</button>
                            <div class="quick-result mt-2 small text-break" id="quick-hmac-sha256"></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-3">
                    <div class="card shadow-sm h-100">
                        <div class="card-body text-center">
                            <i class="bi bi-fingerprint fs-2 text-primary"></i>
                            <h6 class="mt-2">Session Key</h6>
                            <p class="text-muted small mb-2">64-byte random Base64</p>
                            <button class="btn btn-sm btn-outline-primary quickGenBtn" data-preset="session">Generate</button>
                            <div class="quick-result mt-2 small text-break" id="quick-session"></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-3">
                    <div class="card shadow-sm h-100">
                        <div class="card-body text-center">
                            <i class="bi bi-hash fs-2 text-warning"></i>
                            <h6 class="mt-2">UUID v4</h6>
                            <p class="text-muted small mb-2">Random UUID</p>
                            <button class="btn btn-sm btn-outline-warning quickGenBtn" data-preset="uuid">Generate</button>
                            <div class="quick-result mt-2 small text-break" id="quick-uuid"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/keygen.js}"></script>
</th:block>
</body>
</html>
