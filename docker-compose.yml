services:
  home-utils:
    image: ghcr.io/adarshraj/home-utils:latest
    container_name: home-utils
    restart: unless-stopped
    expose:
      - "8730"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    networks:
      - platform_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.home-utils.rule=Host(`${HOME_UTILS_HOST:-home-utils.homelab.local}`)"
      - "traefik.http.routers.home-utils.entrypoints=websecure"
      - "traefik.http.routers.home-utils.tls=true"
      - "traefik.http.services.home-utils.loadbalancer.server.port=8730"
      - "traefik.http.routers.home-utils.middlewares=ratelimit@file,secure-headers@file"
      - "traefik.http.routers.home-utils.service=home-utils"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8730/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

networks:
  platform_proxy:
    external: true
